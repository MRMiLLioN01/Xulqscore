<style>
:root{--bg:#F6F8FC;--card:#fff;--border:#E3E9F3;--text:#12203A;--muted:#5B6C88;--navy:#1E3A6A;--orange:#F26A21;--teal:#17A2A0}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.65}
.wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
header{background:var(--navy);color:#fff;padding:18px 0}
header .wrap{padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:800;font-size:18px;cursor:pointer}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;gap:2px}
.seg button{background:transparent;border:0;color:#C7D6EE;padding:6px 12px;border-radius:8px;font-weight:700;font-size:13px;cursor:pointer;font-family:inherit}
.seg button.on{background:#fff;color:var(--navy)}
h1{font-size:28px;font-weight:800;margin:26px 0 6px}
.upd{color:var(--muted);font-size:13.5px;margin-bottom:22px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:24px;margin-bottom:16px}
h2{font-size:17.5px;font-weight:800;margin:0 0 10px;color:var(--navy)}
p{margin-bottom:10px;font-size:14.5px}
ul{margin:8px 0 10px 20px}
li{font-size:14.5px;margin-bottom:6px}
a{color:var(--orange)}
.back{display:inline-block;margin-top:8px;background:var(--navy);color:#fff;text-decoration:none;padding:11px 18px;border-radius:11px;font-weight:700;font-size:14px}
.hi{background:#17A2A012;border:1px solid #17A2A040;border-radius:12px;padding:14px 16px;font-size:14px}
footer{color:var(--muted);font-size:12.5px;text-align:center;padding:20px}
@media(max-width:560px){.wrap{padding:20px 16px 44px}h1{font-size:22px;margin:18px 0 6px}h2{font-size:16px}.card{padding:18px;border-radius:14px}p,li{font-size:14px}header .wrap{padding:0 16px}.brand{font-size:16px}.seg button{padding:5px 9px;font-size:12px}}

/* ===== shared motion layer (v3) ===== */
:root{--e-out:cubic-bezier(.22,.9,.28,1);--e-spring:cubic-bezier(.34,1.5,.5,1);
 --sheen:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.4) 50%,transparent 78%)}
.btn{position:relative;overflow:hidden;isolation:isolate;
 transition:transform .3s var(--e-spring),box-shadow .35s var(--e-out),background-position .5s var(--e-out),border-color .3s,filter .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:1;background:var(--sheen);transform:translateX(-135%)}
.btn:hover::before{transform:translateX(135%);transition:transform .9s var(--e-out)}
.btn:active{transform:scale(.965)!important}
.btn-primary:hover{transform:translateY(-3px) scale(1.02)}
.btn-navy:hover,.btn-ghost:hover,.btn-teal:hover{transform:translateY(-2px)}
.rp{position:absolute;border-radius:50%;transform:scale(0);opacity:.5;background:rgba(255,255,255,.45);
 animation:rip .62s var(--e-out) forwards;pointer-events:none;z-index:1}
.btn-ghost .rp,.seg button .rp{background:rgba(42,78,134,.25)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.card{transition:transform .4s var(--e-out),box-shadow .4s var(--e-out)}
.brand{transition:transform .4s var(--e-spring)}
.brand:hover{transform:scale(1.03)}
.seg button{transition:.25s var(--e-out)}
.seg button:hover{transform:translateY(-1px)}
.field input,.field select,.code-input{transition:border-color .25s,box-shadow .35s var(--e-out),transform .3s var(--e-out)}
.field input:focus,.field select:focus,.code-input:focus{transform:translateY(-1px)}
.pill,.band,.tag{transition:transform .3s var(--e-spring)}
.pill:hover,.tag:hover{transform:scale(1.06)}
.abar .tr i,.tr i{transition:width 1s var(--e-out)}
a.back{transition:transform .3s var(--e-out),color .25s}
a.back:hover{transform:translateX(-4px)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s var(--e-out),transform .7s var(--e-out)}
.rv.in{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
body>.wrap,.center-wrap{animation:fadeUp .6s var(--e-out) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
 .rv{opacity:1!important;transform:none!important}}

</style>

<footer>© 2026 XulqskorAI</footer>
<script>
const T={
uz:{title:"Maxfiylik siyosati va shaxsiy ma'lumotlarga rozilik",upd:"Oxirgi yangilanish: 2026-yil 23-iyul · Versiya 1.0",
 back:"← Bosh sahifaga",
 s:[
 ["Biz kim uchun va nima uchun ishlaymiz","XulqskorAI — xulq-atvor va muqobil ma'lumotlar asosida kredit ishonchliligini baholovchi platforma. Ushbu hujjat qanday ma'lumotlarni yig'ishimizni, ulardan qanday foydalanishimizni va sizda qanday huquqlar borligini tushuntiradi."],
 ["Qanday ma'lumotlarni yig'amiz","Biz faqat baholash uchun zarur ma'lumotlarni yig'amiz:<ul><li><b>Hisob ma'lumotlari:</b> telefon raqamingiz, ismingiz va (ixtiyoriy) elektron pochtangiz. Yuridik shaxs uchun — tashkilot nomi.</li><li><b>Diagnostika javoblari:</b> savollarga bergan javoblaringiz va javob berish vaqti.</li><li><b>Natijalar:</b> olti o'lcham bo'yicha ballaringiz, umumiy ball va ishonch koeffitsiyenti.</li><li><b>Texnik ma'lumotlar:</b> rozilik berilgan vaqt va brauzer ma'lumoti.</li></ul>Biz pasport nusxasi, bank kartasi raqami yoki parolingizni so'ramaymiz va saqlamaymiz."],
 ["Ma'lumotlardan qanday foydalanamiz","Ma'lumotlar quyidagi maqsadlarda ishlatiladi: baholash natijasini hisoblash; natijani sizga va (roziligingiz bilan) hamkor tashkilotga taqdim etish; metodikaning sifatini oshirish; firibgarlik va nohalol javoblarni aniqlash. <b>Biz ma'lumotlaringizni sotmaymiz</b> va reklama maqsadida uchinchi shaxslarga bermaymiz."],
 ["Ma'lumot kimga ko'rsatiladi","Natijangiz sizga ochiq. Platforma administratorlari sifat nazorati uchun natijalarni ko'rishi mumkin — har bir amal jurnalda qayd etiladi. Hamkor moliya tashkilotiga natija <b>faqat siz aniq rozilik berganingizda</b> uzatiladi."],
 ["Qancha muddat saqlanadi","Hisobingiz faol bo'lgunicha saqlaymiz. Hisobni o'chirishni so'rasangiz, ma'lumotlaringiz o'chiriladi yoki shaxsni aniqlab bo'lmaydigan holatga keltiriladi."],
 ["Sizning huquqlaringiz","Siz istalgan vaqtda: ma'lumotlaringizni ko'rish, ularning nusxasini olish (shaxsiy kabinetdan PDF), noto'g'ri ma'lumotni to'g'rilash, roziligingizni qaytarib olish va hisobingizni o'chirishni so'rash huquqiga egasiz. Buning uchun <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a> ga murojaat qiling."],
 ["Xavfsizlik","Ma'lumotlar shifrlangan ulanish (HTTPS) orqali uzatiladi va kirish huquqi cheklangan bazada saqlanadi. Parollar faqat qaytarib bo'lmaydigan (hash) ko'rinishda saqlanadi."],

 ["Bog'lanish","Savollar bo'yicha: <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a>"]
]},
ru:{title:"Политика конфиденциальности и согласие на обработку данных",upd:"Последнее обновление: 23 июля 2026 г. · Версия 1.0",
 back:"← На главную",
 s:[
 ["Кто мы и зачем это нужно","XulqskorAI — платформа оценки кредитного доверия на основе поведения и альтернативных данных. Этот документ объясняет, какие данные мы собираем, как их используем и какие у вас права."],
 ["Какие данные мы собираем","Мы собираем только необходимое для оценки:<ul><li><b>Данные аккаунта:</b> номер телефона, имя и (по желанию) email. Для юрлиц — название организации.</li><li><b>Ответы диагностики:</b> ваши ответы и время ответа.</li><li><b>Результаты:</b> баллы по шести измерениям, общий балл и коэффициент достоверности.</li><li><b>Технические данные:</b> время согласия и данные браузера.</li></ul>Мы не запрашиваем и не храним копию паспорта, номер банковской карты или ваши пароли."],
 ["Как мы используем данные","Данные используются для: расчёта результата; предоставления результата вам и (с вашего согласия) организации-партнёру; повышения качества методики; выявления мошенничества и недобросовестных ответов. <b>Мы не продаём ваши данные</b> и не передаём их третьим лицам в рекламных целях."],
 ["Кому доступны данные","Ваш результат доступен вам. Администраторы платформы могут видеть результаты для контроля качества — каждое действие фиксируется в журнале. Партнёрской финансовой организации результат передаётся <b>только при вашем явном согласии</b>."],
 ["Срок хранения","Мы храним данные, пока ваш аккаунт активен. По запросу на удаление данные удаляются или обезличиваются."],
 ["Ваши права","Вы вправе в любой момент: просматривать свои данные, получить их копию (PDF в личном кабинете), исправить неточности, отозвать согласие и запросить удаление аккаунта. Обращайтесь: <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a>."],
 ["Безопасность","Данные передаются по защищённому соединению (HTTPS) и хранятся в базе с ограниченным доступом. Пароли хранятся только в необратимом (хешированном) виде."],
 ["Важное примечание","Результат оценки — это <b>дополнительный сигнал</b>, а не окончательное кредитное решение. Решение всегда принимает партнёрская финансовая организация."],
 ["Контакты","По вопросам: <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a>"]
]},
en:{title:"Privacy Policy & Data Processing Consent",upd:"Last updated: 23 July 2026 · Version 1.0",
 back:"← Back to home",
 s:[
 ["Who we are and why this matters","XulqskorAI assesses credit trustworthiness using behaviour and alternative data. This document explains what we collect, how we use it, and the rights you have."],
 ["What we collect","We collect only what the assessment requires:<ul><li><b>Account data:</b> your phone number, name and (optionally) email. For legal entities, the organisation name.</li><li><b>Assessment answers:</b> your answers and response times.</li><li><b>Results:</b> your six dimension scores, overall score and trust coefficient.</li><li><b>Technical data:</b> the time consent was given and browser information.</li></ul>We never ask for or store passport scans, bank card numbers, or your passwords."],
 ["How we use it","Data is used to: calculate your result; provide it to you and (with your consent) to a partner organisation; improve the methodology; and detect fraud or dishonest answering. <b>We do not sell your data</b> and never share it with third parties for advertising."],
 ["Who can see it","Your result is available to you. Platform administrators may view results for quality control — every action is recorded in an audit log. A result is shared with a partner financial organisation <b>only with your explicit consent</b>."],
 ["How long we keep it","We keep data while your account is active. On a deletion request, your data is erased or anonymised."],
 ["Your rights","At any time you may: view your data, obtain a copy (PDF from your cabinet), correct inaccuracies, withdraw consent, and request account deletion. Contact <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a>."],
 ["Security","Data travels over an encrypted connection (HTTPS) and is stored in a database with restricted access. Passwords are stored only in irreversible (hashed) form."],
 ["Important note","An assessment result is an <b>additional signal</b>, not a final lending decision. The decision is always made by the partner financial organisation."],
 ["Contact","Questions: <a href='mailto:info@xulqskor.uz'>info@xulqskor.uz</a>"]
]}};
let L=(location.hash||'').replace('#','')||localStorage.getItem('xs_lang')||'uz';
if(!T[L])L='uz';
function draw(){
  const t=T[L];
  document.documentElement.lang=L;
  document.title=t.title+' — XulqskorAI';
  document.getElementById('content').innerHTML=
    `<h1>${t.title}</h1><div class="upd">${t.upd}</div>`+
    t.s.map(([h,b])=>`<div class="card"><h2>${h}</h2><p>${b}</p></div>`).join('')+
    `<a class="back" href="/">${t.back}</a>`;
  document.querySelectorAll('#seg button').forEach(b=>b.classList.toggle('on',b.dataset.l===L));
}
document.querySelectorAll('#seg button').forEach(b=>b.onclick=()=>{L=b.dataset.l;localStorage.setItem('xs_lang',L);draw();});
draw();

<script>
/* shared motion: reveal + ripple */
(function(){
 var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function start(){
  if(rm)return;
  if('IntersectionObserver' in window){
   var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -6% 0px'});
   document.querySelectorAll('.card,.res-hero,.abar,.adm-card,.kpi,h2,.upd').forEach(function(el,i){
    if(el.closest('.topbar'))return;el.classList.add('rv');el.style.transitionDelay=Math.min(i*60,300)+'ms';io.observe(el);
    setTimeout(function(){el.style.transitionDelay='';},1400);});
  }
  document.addEventListener('pointerdown',function(e){
   var el=e.target.closest&&e.target.closest('.btn,.seg button,button');
   if(!el||el.disabled)return;var r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;
   var s=document.createElement('span');s.className='rp';s.style.width=s.style.height=d+'px';
   s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
   var cs=getComputedStyle(el);if(cs.position==='static')el.style.position='relative';
   if(cs.overflow==='visible')el.style.overflow='hidden';
   el.appendChild(s);setTimeout(function(){s.remove();},650);
  },{passive:true});
 }
 document.addEventListener('DOMContentLoaded',start);
})();
</script>
