@media(max-width:560px){.wrap{padding:20px 16px 44px}h1{font-size:22px;margin:18px 0 6px}h2{font-size:16px}.card{padding:18px;border-radius:14px}p,li{font-size:14px}header .wrap{padding:0 16px}.brand{font-size:16px}.seg button{padding:5px 9px;font-size:12px}}

/* ===== shared motion layer (v3) ===== */
:root{--e-out:cubic-bezier(.22,.9,.28,1);--e-spring:cubic-bezier(.34,1.5,.5,1);
 --sheen:linear-gradient(105deg,transparent 22%,rgba(255,255,255,.4) 50%,transparent 78%)}
.btn{position:relative;overflow:hidden;isolation:isolate;
 transition:transform .3s var(--e-spring),box-shadow .35s var(--e-out),background-position .5s var(--e-out),border-color .3s,filter .3s}
.btn::before{content:"";position:absolute;inset:0;z-index:1;background:var(--sheen);transform:translateX(-135%)}
.btn:hover::before{transform:translateX(135%);transition:transform .9s var(--e-out)}
.btn:active{transform:scale(.965)!important}
.btn-primary:hover{transform:translateY(-3px) scale(1.02)}
.btn-navy:hover,.btn-ghost:hover,.btn-teal:hover{transform:translateY(-2px)}
.rp{position:absolute;border-radius:50%;transform:scale(0);opacity:.5;background:rgba(255,255,255,.45);
 animation:rip .62s var(--e-out) forwards;pointer-events:none;z-index:1}
.btn-ghost .rp,.seg button .rp{background:rgba(42,78,134,.25)}
@keyframes rip{to{transform:scale(1);opacity:0}}
.card{transition:transform .4s var(--e-out),box-shadow .4s var(--e-out)}
.brand{transition:transform .4s var(--e-spring)}
.brand:hover{transform:scale(1.03)}
.seg button{transition:.25s var(--e-out)}
.seg button:hover{transform:translateY(-1px)}
.field input,.field select,.code-input{transition:border-color .25s,box-shadow .35s var(--e-out),transform .3s var(--e-out)}
.field input:focus,.field select:focus,.code-input:focus{transform:translateY(-1px)}
.pill,.band,.tag{transition:transform .3s var(--e-spring)}
.pill:hover,.tag:hover{transform:scale(1.06)}
.abar .tr i,.tr i{transition:width 1s var(--e-out)}
a.back{transition:transform .3s var(--e-out),color .25s}
a.back:hover{transform:translateX(-4px)}
.rv{opacity:0;transform:translateY(20px);transition:opacity .7s var(--e-out),transform .7s var(--e-out)}
.rv.in{opacity:1;transform:none}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
body>.wrap,.center-wrap{animation:fadeUp .6s var(--e-out) both}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;transition-duration:.001ms!important}
 .rv{opacity:1!important;transform:none!important}}

 ["Who we are","XulqskorAI is a behavioural credit-assessment service at pilot stage in Tashkent, Uzbekistan. It is currently operated by its founder, <b>Muhriddin Husenov</b>, while a legal entity is being registered; this policy will be updated with the company's details once registration is complete. We act as the operator of your personal data under the Law of the Republic of Uzbekistan “On Personal Data” (No. ZRU-547 of 2 July 2019, as amended). Contact: <a href='mailto:xulqscore@gmail.com'>xulqscore@gmail.com</a>."],
 ["What we collect","We collect only what the service needs:<ul><li><b>Account data:</b> phone number, full name and (optionally) email; for legal entities, the organisation name. Your password is handled by our authentication provider and stored only as a one-way hash — nobody at XulqskorAI can see it.</li><li><b>Assessment data:</b> your answers, the time taken per question, and session-integrity signals (for example, whether the browser tab lost focus).</li><li><b>Results:</b> overall score, band, six dimension scores and recommendations.</li><li><b>Consent records:</b> when you gave or withdrew consent, and the share codes you create.</li><li><b>Technical data:</b> browser type and error reports needed to keep the service working.</li><li><b>Pilot enquiries:</b> name, institution, work email, monthly volume and your message, if you use the “Request a pilot” form.</li></ul>We never ask for passport scans, bank card numbers or bank statements."],

 ["Who can see it","You can see your own result. A partner financial organisation sees it only after you share a consent code with them. A small number of authorised administrators can view results for quality control, and every such action is recorded in an audit log."],
 ["Service providers and where data is stored","We use these providers to run the service:<ul><li><b>Supabase</b> — database and sign-in. Data is stored in the European Union (Frankfurt, Germany).</li><li><b>Vercel</b> — website hosting and delivery.</li><li><b>Google</b> — web fonts, and the YouTube video (the video player loads only when you press play).</li><li><b>jsDelivr</b> — delivery of a standard software library.</li></ul>Storing data in Germany is a cross-border transfer. By accepting this policy you consent to it; we apply the security measures below and follow the cross-border transfer rules of the Law “On Personal Data”."],

 ["Your rights","At any time you may: see your data, get a copy (PDF from your cabinet), correct inaccurate data, withdraw consent, revoke a share code, and ask us to delete your account. Write to <a href='mailto:xulqscore@gmail.com'>xulqscore@gmail.com</a>; we reply within 30 days. Withdrawing consent does not affect processing that already took place."],
 ["Security","All traffic is encrypted (HTTPS). The database uses row-level access rules, so each user can reach only their own records. Scoring logic runs on the server, and administrator actions are logged."],
 ["Cookies and local storage","We do not use advertising or analytics trackers. Your browser stores your sign-in session, language and light/dark theme so the site works as expected."],

 ["Important note","An assessment result is an <b>additional signal</b>, not a lending decision. The decision is always made by the partner financial organisation, which remains responsible for it."],

 ["Кто видит данные","Свой результат видите вы. Партнёрская организация видит его только после того, как вы передадите ей код согласия. Ограниченное число уполномоченных администраторов может просматривать результаты для контроля качества; каждое такое действие записывается в журнал аудита."],
 ["Поставщики услуг и место хранения","Для работы сервиса мы используем:<ul><li><b>Supabase</b> — база данных и авторизация. Данные хранятся в Европейском союзе (Франкфурт, Германия).</li><li><b>Vercel</b> — хостинг и доставка сайта.</li><li><b>Google</b> — веб-шрифты и видео YouTube (плеер загружается только после нажатия кнопки воспроизведения).</li><li><b>jsDelivr</b> — доставка стандартной программной библиотеки.</li></ul>Хранение данных в Германии является трансграничной передачей. Принимая эту политику, вы даёте на неё согласие; мы применяем меры защиты, описанные ниже, и соблюдаем правила трансграничной передачи Закона «О персональных данных»."],

 ["Безопасность","Весь трафик шифруется (HTTPS). В базе данных действуют правила доступа на уровне строк: каждый пользователь видит только свои записи. Расчёт баллов выполняется на сервере, действия администраторов журналируются."],
 ["Cookies и локальное хранилище","Мы не используем рекламные и аналитические трекеры. Браузер хранит вашу сессию входа, язык и тему оформления, чтобы сайт работал корректно."],

<script>
/* shared motion: reveal + ripple */
(function(){
 var rm=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 function start(){
  if(rm)return;
  if('IntersectionObserver' in window){
   var io=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');io.unobserve(e.target);}});},{threshold:.1,rootMargin:'0px 0px -6% 0px'});
   document.querySelectorAll('.card,.res-hero,.abar,.adm-card,.kpi,h2,.upd').forEach(function(el,i){
    if(el.closest('.topbar'))return;el.classList.add('rv');el.style.transitionDelay=Math.min(i*60,300)+'ms';io.observe(el);
    setTimeout(function(){el.style.transitionDelay='';},1400);});
  }
  document.addEventListener('pointerdown',function(e){
   var el=e.target.closest&&e.target.closest('.btn,.seg button,button');
   if(!el||el.disabled)return;var r=el.getBoundingClientRect(),d=Math.max(r.width,r.height)*2;
   var s=document.createElement('span');s.className='rp';s.style.width=s.style.height=d+'px';
   s.style.left=(e.clientX-r.left-d/2)+'px';s.style.top=(e.clientY-r.top-d/2)+'px';
   var cs=getComputedStyle(el);if(cs.position==='static')el.style.position='relative';
   if(cs.overflow==='visible')el.style.overflow='hidden';
   el.appendChild(s);setTimeout(function(){s.remove();},650);
  },{passive:true});
 }
 document.addEventListener('DOMContentLoaded',start);
})();
</script>
